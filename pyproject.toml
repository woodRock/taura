[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taura"
version = "0.1.0"
description = "Plain-text provenance ledger linking papers to code"
requires-python = ">=3.10"
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
tui = ["textual>=8"]
yaml = ["pyyaml>=6"]
test = ["pytest", "textual>=8", "pyyaml>=6"]

[project.scripts]
taura = "taura.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taura = ["templates/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
